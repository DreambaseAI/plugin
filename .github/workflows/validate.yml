name: Validate slim plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check:plugin
      - run: npm test
      - name: Validate portable schemas
        run: |
          curl --fail --silent --show-error https://agent-plugins.org/schemas/1.0.0/plugin.schema.json -o /tmp/plugin.schema.json
          curl --fail --silent --show-error https://agent-plugins.org/schemas/1.0.0/mcp.schema.json -o /tmp/mcp.schema.json
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 --strict=false -s /tmp/plugin.schema.json -d plugin.json
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 --strict=false -s /tmp/mcp.schema.json -d mcp.json
      - name: Validate Claude
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.293 plugin validate .claude-plugin/plugin.json --strict
          npx --yes @anthropic-ai/claude-code@2.1.293 plugin validate .claude-plugin/marketplace.json --strict
      - name: Validate Cursor
        run: |
          curl --fail --silent --show-error https://raw.githubusercontent.com/cursor/plugin-template/46216072ac5750f782f95bb325b4d12b7c3ae9c9/scripts/validate-template.mjs -o /tmp/validate-cursor.mjs
          node /tmp/validate-cursor.mjs
      - name: Test published installer wiring
        run: node tests/installer-smoke.mjs
      - run: npm run build:plugin
      - uses: actions/upload-artifact@v4
        with:
          name: dreambase-plugin
          path: |
            dist/dreambase-plugin.zip
            dist/package-report.json
          if-no-files-found: error
